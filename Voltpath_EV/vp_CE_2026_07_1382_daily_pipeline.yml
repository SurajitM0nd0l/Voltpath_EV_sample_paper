resources:
  jobs:
    vp_CE_2026_07_1382_daily_pipeline:
      name: vp_CE_2026_07_1382_daily_pipeline
      email_notifications:
        on_failure:
          - surajitm0nd0l12@gmail.com
      schedule:
        quartz_cron_expression: 39 0 7 * * ?
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/surajitm0nd0l12@gmail.com/Voltpath_EV_sample_paper/Voltpath_EV/01_Bronze_Injestion
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 1800000
          disable_auto_optimization: false
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/surajitm0nd0l12@gmail.com/Voltpath_EV_sample_paper/Voltpath_EV/02_bronze_to_silver
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/surajitm0nd0l12@gmail.com/Voltpath_EV_sample_paper/Voltpath_EV/03_gold
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: vp_ce_2026_07_1382
        - name: checkpoint_name
          default: ADHOC
      performance_target: PERFORMANCE_OPTIMIZED
